[project]
name = "cosma-backend"
version = "1.2.0"
description = "Cosma backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asqlite>=2.0.0",
    "huggingface-hub>=0.26.0",
    # Bundled static ffmpeg binary — used as the last-resort fallback when
    # no system ffmpeg is on PATH. macOS apps launched outside a shell
    # don't inherit the user's shell PATH, so /opt/homebrew/bin/ffmpeg is
    # invisible to subprocess calls. Without a fallback, every video file
    # ended up with a "codec unsupported" placeholder.
    "imageio-ffmpeg>=0.5.0",
    "litellm>=1.77.5",
    "llama-cpp-python>=0.3.0",
    # xlsx/xls extras pull in openpyxl + xlrd so MarkItDown can read
    # Excel workbooks. Without these, every .xlsx silently came back
    # empty and ended up in the Failed tab as "All extraction methods
    # failed or returned empty content".
    # outlook adds olefile so .msg files (Outlook saved emails — common
    # in corporate Documents folders) can be parsed.
    "markitdown[docx,pdf,pptx,xlsx,xls,outlook]>=0.1.4",
    # Pure-Python tag reader for audio files (ID3 for mp3, MP4 atoms for
    # m4a/aac, Vorbis for flac/ogg). When whisper finds no speech in a
    # music track, the file's embedded artist/title/album tags are still
    # the right thing to index — gives the user a useful search hit
    # without uploading audio anywhere.
    "mutagen>=1.47.0",
    "ollama>=0.6.0",
    # HEIF/HEIC decoder for Pillow. Without this, every iPhone screenshot
    # and photo (.heic/.HEIC) fails the parser ("cannot identify image
    # file") because Pillow ships without HEIF support.
    "pillow-heif>=0.18.0",
    "platformdirs>=4.5.0",
    # Complementary PDF text scraper — different parser internals than
    # MarkItDown's pdfminer path, so it occasionally salvages PDFs that
    # come back empty from MarkItDown (encrypted-with-empty-password,
    # unusual font encodings, malformed xref tables).
    "pypdf>=5.0.0",
    # macOS-only OCR for scanned PDFs via Vision framework.
    # Marker ensures pip skips these on non-Darwin dev machines.
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pywhispercpp>=1.3.0",
    "quart>=0.20.0",
    "quart-schema>=0.22.0",
    "structlog>=25.1.0",
    "sentence-transformers>=5.1.1",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.11.0",
    "tomli-w>=1.0.0",
    "uvicorn>=0.38.0",
    "watchdog>=6.0.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
# Historical alias — llama-cpp-python is now a core dep, kept here so any
# existing `uv sync --extra llamacpp` still resolves.
llamacpp = [
    "llama-cpp-python",
]

[tool.pyright]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "basedpyright<=1.31.7",
    "pyinstaller>=6.16.0",
]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=3.15.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml"
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (database, file system)",
    "slow: Slow tests (network calls, AI services)",
    "async_test: Tests that use async/await",
    "benchmark: End-to-end benchmarks (read real files, write reports). Off by default — opt in with `pytest -m benchmark`."
]

[tool.uv.sources]
llama-cpp-python = [
    { url = "https://github.com/cosmasense/llama-cpp-python/releases/download/v0.3.32-metal/llama_cpp_python-0.3.32-cp313-cp313-macosx_11_0_arm64.whl", marker = "python_version >= '3.13' and sys_platform == 'darwin'" },
    { url = "https://github.com/cosmasense/llama-cpp-python/releases/download/v0.3.32-metal/llama_cpp_python-0.3.32-cp312-cp312-macosx_11_0_arm64.whl", marker = "python_version >= '3.12' and python_version < '3.13' and sys_platform == 'darwin'" },
    { git = "https://github.com/cosmasense/llama-cpp-python", marker = "sys_platform != 'darwin'" },
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
