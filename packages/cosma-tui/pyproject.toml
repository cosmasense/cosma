[project]
name = "cosma-tui"
version = "1.2.1"
description = "Cosma TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cosma-client",
    "platformdirs>=4.4.0",
    "textual>=6.1.0",
]

[tool.uv.sources]
cosma-client = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright<=1.31.7",
    "textual-dev>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
